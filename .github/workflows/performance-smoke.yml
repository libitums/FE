name: Performance smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1-5"

permissions:
  contents: read
  packages: read

concurrency:
  group: performance-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS 26.5 simulator
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm, Node.js and dependencies
        uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}

      - name: Confirm arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Run reusable performance smoke
        run: pnpm --filter @libitums/mobile performance:capture:smoke
