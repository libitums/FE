name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

# 취소는 같은 PR의 앞 push에만 뜻이 있습니다. main push까지 끊으면 연달아 병합할 때 앞
# 커밋이 main에서 판정 없이 지나갑니다(#254가 그렇게 지나갔습니다). main은 같은 그룹 안에서
# 차례로 돕니다.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 잡을 나눈 이유는 둘입니다. 하나로 돌리면 `&&` 사슬이 첫 실패에서 멈춰 나머지 결과를 다음
# 밀기까지 못 보고, 20 ms짜리 포맷 검사가 빌드가 끝나기를 기다립니다.
#
# `pnpm verify`는 로컬 한 줄로 그대로 둡니다. 여기 잎 명령의 합이 그 한 줄과 같은지는
# `devtools/ci-wiring/verify-coverage.unit.test.mjs`가 지킵니다 — 검사가 CI에서 조용히
# 빠지는 것을 막는 자리입니다.
jobs:
  static:
    name: Format, types, lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # 셋을 한 잡에 두되 `&&`로 잇지 않습니다. 앞 단계가 실패해도 뒤 단계가 돌아 한 번에
      # 전부 보입니다.
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

  # mobile vitest가 테스트 시간의 대부분이라 샤드 셋으로 나눠 동시에 돕니다. 커버리지는 각
  # 샤드가 같은 실행에서 세고(테스트를 두 번 돌지 않습니다), 「Tests」가 blob을 합칩니다.
  test-mobile:
    name: Tests · mobile ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run mobile tests (shard)
        run: pnpm --filter @libitums/mobile test:all --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob --outputFile.blob=blob-reports/blob-${{ matrix.shard }}.json
        env:
          VITEST_COVERAGE: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-mobile-${{ matrix.shard }}
          # 실패한 샤드만 다시 돌릴 때 재실행본이 같은 이름의 옛 blob을 덮습니다 — 그러지 않으면
          # 합치기가 옛 실패본을 집습니다.
          overwrite: true
          path: apps/mobile/blob-reports/
          retention-days: 1
          if-no-files-found: error

  # `pnpm test`에서 mobile을 뺀 나머지입니다. 샤드와 동시에 돕니다.
  test-rest:
    name: Tests · rest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run remaining tests
        shell: bash
        run: pnpm test:rest 2>&1 | tee test-output.txt
        env:
          VITEST_COVERAGE: "1"
      - name: Coverage summary (ui-lynx)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## 커버리지 — ui-lynx"
            echo '```text'
            grep -A6 "Coverage summary" test-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 필수 검사 「Tests」입니다(main ruleset). 앞 잡이 하나라도 실패 · 취소되면 여기서 실패합니다
  # — 이름이 그대로라 ruleset을 고치지 않습니다. 커버리지는 숫자만 남기고 게이트로 걸지 않습니다.
  test:
    name: Tests
    needs: [test-mobile, test-rest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every test job
        env:
          MOBILE: ${{ needs.test-mobile.result }}
          REST: ${{ needs.test-rest.result }}
        run: |
          echo "mobile shards: $MOBILE, rest: $REST"
          test "$MOBILE" = success && test "$REST" = success
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-mobile-*
          path: apps/mobile/blob-reports
          merge-multiple: true
      - name: Merge mobile shard reports
        shell: bash
        run: pnpm --filter @libitums/mobile test:merge 2>&1 | tee merge-output.txt
        env:
          VITEST_COVERAGE: "1"
      - name: Coverage summary (mobile)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## 커버리지 — mobile"
            echo '```text'
            grep -A6 "Coverage summary" merge-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: pnpm build
      # 예산 검사는 산출물이 있어야 뜻이 있으므로 같은 잡에서 빌드 뒤에 돕니다.
      - name: Check bundle size
        run: pnpm size:check

  # Kotlin · Gradle · 번들 동기화가 깨지면 여기서 잡힙니다. 경로 조건은 워크플로가 아니라 이 잡 안에서
  # 겁니다 — 해당 없는 PR에서도 잡이 「건너뜀」으로 성공해야 필수 검사가 대기에 갇히지 않습니다. 판정은
  # devtools/android-build/paths.mjs가 하고, main push는 늘 빌드합니다.
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: decide
        run: node devtools/android-build/should-build.mjs
        env:
          ANDROID_BUILD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ANDROID_BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        if: ${{ steps.decide.outputs.build == 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v6
        if: ${{ steps.decide.outputs.build == 'true' }}
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Bundle for Android
        if: ${{ steps.decide.outputs.build == 'true' }}
        run: pnpm bundle:android
      - name: Assemble bundled APK
        if: ${{ steps.decide.outputs.build == 'true' }}
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleBundled

  policy:
    name: Performance report policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 정책은 base와 head 사이의 변경 목록을 읽으므로 전체 이력이 필요합니다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check performance report policy
        run: pnpm performance:reports:gate
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
