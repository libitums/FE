name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 잡을 나눈 이유는 둘입니다. 하나로 돌리면 `&&` 사슬이 첫 실패에서 멈춰 나머지 결과를 다음
# 밀기까지 못 보고, 20 ms짜리 포맷 검사가 빌드가 끝나기를 기다립니다.
#
# `pnpm verify`는 로컬 한 줄로 그대로 둡니다. 여기 잎 명령의 합이 그 한 줄과 같은지는
# `devtools/ci-wiring/verify-coverage.unit.test.mjs`가 지킵니다 — 검사가 CI에서 조용히
# 빠지는 것을 막는 자리입니다.
jobs:
  static:
    name: Format, types, lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@libitums"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 셋을 한 잡에 두되 `&&`로 잇지 않습니다. 앞 단계가 실패해도 뒤 단계가 돌아 한 번에
      # 전부 보입니다.
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@libitums"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: pnpm test

  build:
    name: Build and bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@libitums"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: pnpm build
      # 예산 검사는 산출물이 있어야 뜻이 있으므로 같은 잡에서 빌드 뒤에 돕니다.
      - name: Check bundle size
        run: pnpm size:check

  policy:
    name: Performance report policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 정책은 base와 head 사이의 변경 목록을 읽으므로 전체 이력이 필요합니다.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@libitums"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check performance report policy
        run: pnpm performance:reports:gate
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  # 커버리지는 숫자만 남깁니다. 퍼센트를 게이트로 걸지 않으므로 이 잡은 PR을 막지 않습니다.
  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@libitums"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Measure coverage
        run: |
          pnpm test:coverage 2>&1 | tee coverage-output.txt
          {
            echo "## 커버리지"
            echo '```text'
            grep -A6 "Coverage summary" coverage-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
