name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code and performance report policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@libitums"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify code
        run: pnpm verify
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      # 커버리지는 숫자만 남깁니다. 퍼센트를 게이트로 걸지 않으므로 실패해도 PR을 막지
      # 않고, 요약만 작업 로그와 PR 요약에 싣습니다.
      - name: Measure coverage
        if: always()
        continue-on-error: true
        run: |
          pnpm test:coverage 2>&1 | tee coverage-output.txt
          {
            echo "## 커버리지"
            echo '```text'
            grep -A6 "Coverage summary" coverage-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
