name: Setup
description: pnpm · Node(.nvmrc) · GitHub Packages 인증으로 frozen install까지 합니다.

# 잡마다 같은 네 단계를 베껴 두면 레지스트리 · 토큰 · 캐시를 바꿀 때 한 곳이 낡습니다.
# 체크아웃은 여기 넣지 않습니다 — 이 액션 파일을 읽으려면 체크아웃이 먼저 끝나 있어야 하고,
# 정책 잡처럼 이력 깊이가 다른 잡이 있습니다.
inputs:
  token:
    description: "@libitums 패키지를 읽을 토큰(packages: read)"
    required: true

runs:
  using: composite
  steps:
    # 버전은 루트 package.json의 packageManager가 정합니다.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: "@libitums"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
