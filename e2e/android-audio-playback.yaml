# Android native audio through the signed-in Lynx listening screen.
appId: libitum.duru.android
---
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Journey, selected"
    timeout: 30000
- tapOn:
    point: "10%,45%"
# 지도 스크롤은 손을 뗄 때의 속도(fling)에 따라 멈추는 자리가 달라진다. 그래서 먼저 끝까지
# 밀어(맨 끝은 늘 같은 자리) 기준을 만들고, fling이 생기지 않도록 느리게(8초) 되돌려 "Listen to a
# Hello" 노드(상태 표시줄 아래 세로 약 38%)를 누른다. 노드 이름은 Lynx 접근성 트리에 없어
# 좌표로 누른다. 매번 스크롤이 멈춘 뒤에 다음 동작을 한다.
- waitForAnimationToEnd
- repeat:
    times: 8
    commands:
      - swipe:
          start: "50%,80%"
          end: "50%,22%"
          duration: 600
- waitForAnimationToEnd
- swipe:
    start: "50%,20%"
    end: "50%,70%"
    duration: 8000
- swipe:
    start: "50%,20%"
    end: "50%,70%"
    duration: 8000
- waitForAnimationToEnd
- tapOn:
    point: "50%,38%"
- tapOn:
    point: "50%,79%"
- waitForAnimationToEnd
- assertScreenshot:
    path: screenshots/android-audio-listening-390x844.png
    thresholdPercentage: 95
- tapOn:
    point: "33%,58%"
- tapOn:
    point: "33%,58%"
- tapOn:
    point: "11%,17%"
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: "Journey, selected"
    timeout: 10000
