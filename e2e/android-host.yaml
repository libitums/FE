# A2 — Android bundled APK가 개발 서버 없이 온보딩과 로그인 화면을 렌더한다.
appId: libitum.duru.android
---
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome! Are you looking for anything?"
    timeout: 20000
- assertNotVisible: "Settings"
- tapOn: "Next"
- assertNotVisible: "Welcome! Are you looking for anything?"
- tapOn: "Next"
- tapOn: "Get started"
- assertVisible: "Log in or Sign up"
- assertVisible: "Choose how you'd like to continue"
- assertVisible: "Sign in with Apple"
- assertVisible: "Connect with Google"
- assertVisible: "Connect with Facebook"
- assertVisible: "By signing up, you agree to the"
- assertVisible: "Terms of Use"
- assertVisible: "Privacy Policy"
- assertScreenshot:
    path: screenshots/android-login-390x844.png
    thresholdPercentage: 95
