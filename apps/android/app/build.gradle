import com.android.build.api.artifact.SingleArtifact
import javax.inject.Inject

plugins {
  id 'com.android.application'
}

// Local/CI builds remain possible before a Firebase Android app is registered.
if (file('google-services.json').exists()) {
  apply plugin: 'com.google.gms.google-services'
}

apply from: 'sentry.gradle'

// Host audio has one source of truth: apps/ios/Host/{audio,sfx}. Each variant gets its own
// generated assets directory; registering it through the Variant API makes every consumer
// (merge assets, lint, bundle) depend on the sync task.
abstract class SyncHostAudioAssets extends DefaultTask {
  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  abstract DirectoryProperty getAudioSource()

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  abstract DirectoryProperty getSfxSource()

  @OutputDirectory
  abstract DirectoryProperty getOutputDir()

  @Inject
  abstract FileSystemOperations getFs()

  @TaskAction
  void sync() {
    fs.sync {
      from(audioSource) {
        include '*.m4a'
        into 'audio'
      }
      from(sfxSource) {
        include '*.mp3'
        into 'sfx'
      }
      into(outputDir)
    }
  }
}

// Airbridge 값은 추적하지 않는 airbridge.properties에서 읽는다. 없거나 비어 있으면 빈 문자열이고,
// 그때 호스트는 SDK를 건드리지 않는다(AirbridgeEventsConfig). manifestPlaceholders로는 보내지 않는다.
def airbridgeProperties = new Properties()
def airbridgePropertiesFile = file('airbridge.properties')
if (airbridgePropertiesFile.exists()) {
  airbridgePropertiesFile.withInputStream { airbridgeProperties.load(it) }
}
def airbridgeValue = { String key ->
  (airbridgeProperties.getProperty(key) ?: '').trim().replace('\\', '\\\\').replace('"', '\\"')
}

// RevenueCat 공개 SDK 키는 추적하지 않는 revenuecat.properties에서 읽는다(ADR-0144 2단계). 없거나 비어 있으면 빈 문자열이고,
// 그때 호스트는 SDK를 건드리지 않고 구매 모듈도 등록하지 않는다(PurchasesConfig).
def revenueCatProperties = new Properties()
def revenueCatPropertiesFile = file('revenuecat.properties')
if (revenueCatPropertiesFile.exists()) {
  revenueCatPropertiesFile.withInputStream { revenueCatProperties.load(it) }
}
def revenueCatValue = { String key ->
  (revenueCatProperties.getProperty(key) ?: '').trim().replace('\\', '\\\\').replace('"', '\\"')
}

// AdMob 앱 ID는 추적하지 않는 admob.properties에서 읽는다(ADR-0209 D10). 광고 단위 ID는 앱에 두지 않는다 — 서버가 상태 응답으로 내린다.
// 매니페스트 앱 ID(com.google.android.gms.ads.APPLICATION_ID)는 비면 SDK가 앱을 죽이므로, 값이 없을 때 Google 샘플 앱 ID로 채운다.
// 샘플 앱 ID는 release 빌드에서 광고 모듈을 열지 않는다(RewardedAdConfig) — 스토어 빌드는 진짜 앱 ID가 있어야 한다.
def admobProperties = new Properties()
def admobPropertiesFile = file('admob.properties')
if (admobPropertiesFile.exists()) {
  admobPropertiesFile.withInputStream { admobProperties.load(it) }
}
def admobValue = { String key ->
  (admobProperties.getProperty(key) ?: '').trim().replace('\\', '\\\\').replace('"', '\\"')
}
def admobSampleAppId = 'ca-app-pub-3940256099942544~3347511713'

android {
  namespace 'com.libitum.host'
  compileSdk 36

  defaultConfig {
    applicationId 'libitum.duru.android'
    minSdk 26
    targetSdk 36
    // Play에 올릴 커밋에서 손으로 1 올린다 (spec §4). Play에는 22가 이미 올라가 있을 수 있다.
    versionCode 29
    versionName '1.7.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    // debug keeps these empty: dev-server and HMR errors must not reach the collector.
    buildConfigField 'String', 'SENTRY_DSN', '""'
    buildConfigField 'String', 'SENTRY_PROGUARD_UUID', '""'
    buildConfigField 'String', 'AIRBRIDGE_APP_NAME', "\"${airbridgeValue('AIRBRIDGE_APP_NAME')}\""
    buildConfigField 'String', 'AIRBRIDGE_SDK_TOKEN', "\"${airbridgeValue('AIRBRIDGE_SDK_TOKEN')}\""
    buildConfigField 'String', 'REVENUECAT_API_KEY', "\"${revenueCatValue('REVENUECAT_API_KEY')}\""
    buildConfigField 'String', 'ADMOB_APP_ID', "\"${admobValue('ADMOB_APP_ID') ?: admobSampleAppId}\""
    manifestPlaceholders = [admobAppId: admobValue('ADMOB_APP_ID') ?: admobSampleAppId]
  }

  buildTypes {
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      buildConfigField 'String', 'SENTRY_DSN', sentryJavaLiteral(sentrySetting('SENTRY_DSN', 'dsn'))
      buildConfigField 'String', 'SENTRY_PROGUARD_UUID', sentryJavaLiteral(sentryProguardUuid(
          defaultConfig.applicationId, defaultConfig.versionName, defaultConfig.versionCode, 'release'))
    }
    bundled {
      initWith release
      buildConfigField 'String', 'SENTRY_PROGUARD_UUID', sentryJavaLiteral(sentryProguardUuid(
          defaultConfig.applicationId, defaultConfig.versionName, defaultConfig.versionCode, 'bundled'))
      signingConfig signingConfigs.debug
      matchingFallbacks = ['release']
    }
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  androidResources.noCompress += ['m4a', 'mp3']
}

androidComponents {
  onVariants(selector().all()) { variant ->
    def sync = tasks.register("sync${variant.name.capitalize()}HostAudioAssets", SyncHostAudioAssets) {
      audioSource = file('../../ios/Host/audio')
      sfxSource = file('../../ios/Host/sfx')
    }
    variant.sources.assets?.addGeneratedSourceDirectory(sync, { it.outputDir })
    registerPackagedHostAudioChecks(variant.name, variant.artifacts.get(SingleArtifact.APK.INSTANCE),
        variant.artifacts.get(SingleArtifact.BUNDLE.INSTANCE))
    registerNativeAlignmentChecks(variant.name, variant.artifacts.get(SingleArtifact.APK.INSTANCE),
        variant.artifacts.get(SingleArtifact.BUNDLE.INSTANCE))
  }
}

// lynx의 POM이 runtime으로 끌어오는 WebAssembly 엔진이다. 앱은 WebAssembly를 쓰지 않고,
// libwasm.so는 16 KB 정렬이 아니다. 설정 전체에 걸어 다른 경로로 다시 들어오는 것도 막는다.
configurations.configureEach {
  exclude group: 'org.lynxsdk.lynx', module: 'primjsWasm'
}

def lynxVersion = '4.0.1'

dependencies {
  implementation "org.lynxsdk.lynx:lynx:${lynxVersion}"
  implementation "org.lynxsdk.lynx:lynx-jssdk:${lynxVersion}"
  implementation "org.lynxsdk.lynx:lynx-trace:${lynxVersion}"
  implementation 'org.lynxsdk.lynx:primjs:4.0.0'

  implementation "org.lynxsdk.lynx:lynx-service-image:${lynxVersion}"
  implementation "org.lynxsdk.lynx:lynx-service-http:${lynxVersion}"
  implementation "org.lynxsdk.lynx:lynx-service-log:${lynxVersion}"
  implementation 'com.facebook.fresco:fresco:2.3.0'
  implementation 'com.facebook.fresco:animated-gif:2.3.0'
  implementation 'com.facebook.fresco:animated-webp:2.3.0'
  implementation 'com.facebook.fresco:webpsupport:2.3.0'
  implementation 'com.facebook.fresco:animated-base:2.3.0'
  implementation 'com.squareup.okhttp3:okhttp:4.9.0'
  implementation 'androidx.browser:browser:1.8.0'
  implementation 'androidx.core:core:1.15.0'
  // 내 스토리 사진 고르기 — Photo Picker 계약(PickVisualMedia, ADR-0199). 아래 constraints와 같은 판이다.
  implementation 'androidx.activity:activity:1.10.1'
  implementation 'com.google.android.play:review:2.0.2'
  implementation 'io.airbridge:sdk-android:4.12.0'
  // 스토어 결제 · 영수증 · 구독 상태(ADR-0144 D1). 정확 버전 — Play Billing 8을 싣는 줄이다. 키가 없으면 시작하지 않는다.
  implementation 'com.revenuecat.purchases:purchases:10.30.1'
  // 「Out of tickets」의 광고 보고 1장 — AdMob 보상형(ADR-0209). 값이 없으면 시작하지 않는다.
  // appcompat-resources 1.4.1(play hsdp 경유)은 Lynx xelement가 쓰는 appcompat 1.0.0과 클래스가 겹친다(checkBundledDuplicateClasses) —
  // 같은 클래스가 appcompat 1.0.0에 있으므로 뺀다. 광고 불러오기 · 보여 주기는 Android 에뮬레이터에서 테스트 ID로 확인했다.
  implementation('com.google.android.gms:play-services-ads:25.5.0') {
    exclude group: 'androidx.appcompat', module: 'appcompat-resources'
  }
  implementation platform('com.google.firebase:firebase-bom:34.19.0')
  implementation 'com.google.firebase:firebase-messaging'
  implementation 'io.sentry:sentry-android-core:8.60.0'
  implementation 'androidx.lifecycle:lifecycle-process:2.6.2'

  implementation "org.lynxsdk.lynx:xelement:${lynxVersion}"
  implementation "org.lynxsdk.lynx:xelement-input:${lynxVersion}"
  implementation "org.lynxsdk.lynx:xelement-overlay:${lynxVersion}"
  implementation "org.lynxsdk.lynx:xelement-svg:${lynxVersion}"
  implementation 'org.lynxsdk.lynx:servalsvg:0.0.1-alpha.3'

  constraints {
    // Fresco 2.3.0과 Play 라이브러리가 끌어오는 버전이 Play Console SDK 경고 대상이다.
    implementation('com.facebook.soloader:soloader:0.10.5') {
      because 'SoLoader 0.10.4 미만은 64비트 전용 기기에서 비정상 종료한다'
    }
    implementation 'com.facebook.soloader:nativeloader:0.10.5'
    implementation 'com.facebook.soloader:annotation:0.10.5'
    implementation('androidx.fragment:fragment:1.8.9') {
      because '1.1.0은 개발자가 오래된 버전으로 신고했다'
    }
    implementation('androidx.activity:activity:1.10.1') {
      because '1.0.0은 개발자가 오래된 버전으로 신고했다'
    }
    implementation('androidx.datastore:datastore-core-android:1.2.1') {
      because '1.2.0 이하의 libdatastore_shared_counter.so는 16 KB RELRO 정렬이 아니다'
    }
  }

  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20260814'
}

tasks.register('verifyBundledAssets') {
  doLast {
    def assets = file('src/main/assets')
    if (!new File(assets, 'main.lynx.bundle').isFile()) {
      throw new GradleException('Release bundle missing. Run pnpm bundle:android from the repository root.')
    }
    if (!new File(assets, 'static').isDirectory()) {
      throw new GradleException('Release static assets missing. Run pnpm bundle:android from the repository root.')
    }
    def hasFiles = { String dir, String ext ->
      def folder = file(dir)
      folder.isDirectory() && ((folder.listFiles() ?: new File[0]) as List<File>).any { it.name.endsWith(ext) }
    }
    if (!hasFiles('../../ios/Host/audio', '.m4a') || !hasFiles('../../ios/Host/sfx', '.mp3')) {
      throw new GradleException('Host audio sources missing in apps/ios/Host/{audio,sfx}.')
    }
  }
}
tasks.configureEach {
  if (name == 'preReleaseBuild' || name == 'preBundledBuild') {
    dependsOn tasks.named('verifyBundledAssets')
  }
}

// release AAB는 FCM 설정 없이 Play에 올라가면 안 된다. google-services.json은 추적하지 않는 파일이다.
// bundled · debug는 파일 없이도 빌드된다.
tasks.register('verifyReleaseFirebaseConfig') {
  doLast {
    if (!file('google-services.json').exists()) {
      throw new GradleException('Release build needs apps/android/app/google-services.json for libitum.duru.android (Firebase console → Android app). The file is not tracked.')
    }
  }
}
tasks.configureEach {
  if (name == 'preReleaseBuild') {
    dependsOn tasks.named('verifyReleaseFirebaseConfig')
  }
}

apply from: 'packaged-assets.gradle'
apply from: 'native-alignment.gradle'
